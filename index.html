```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Roham AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.app{
    height:100vh;

</head>

<body>

<div class="app">

<header>Roham AI</header>

<div id="messages"></div>

<div class="inputArea">
<div class="inputBox">

<textarea
id="input"
placeholder="سؤالت را بنویس..."
></textarea>

<button id="send">➤</button>

</div>
</div>

</div>

<script>

/*
=================================================
کلید API را اینجا قرار بده
=================================================
*/

const API_KEY = "کلید_API_خودت_را_اینجا_بگذار";


/*
مدل
*/

const MODEL = "gpt-5.6-luna";


const input =
document.getElementById("input");

const send =
document.getElementById("send");

const messages =
document.getElementById("messages");


/*
افزودن پیام
*/

function addMessage(text, type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.textContent =
    text;

    messages.appendChild(div);

    messages.scrollTop =
    messages.scrollHeight;
}


/*
پاسخ رهام
*/

async function askRoham(question){

    /*
    اگر درباره سازنده پرسیده شد،
    پاسخ ثابت داده می‌شود.
    */

    const q =
    question
    .toLowerCase()
    .replaceAll("ي","ی")
    .replaceAll("ك","ک");

    if(
        q.includes("کی تورو ساخته") ||
        q.includes("چه کسی تورو ساخته") ||
        q.includes("چه کسی تو را ساخته") ||
        q.includes("سازنده تو کیه") ||
        q.includes("سازنده‌ات کیه") ||
        q.includes("خالق تو کیه")
    ){

        return "رهام مولایی فر ساخته";

    }


    /*
    درخواست واقعی به API
    */

    const response =
    await fetch(
        "https://api.openai.com/v1/responses",
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json",

                "Authorization":
                "Bearer " + API_KEY
            },

            body:JSON.stringify({

                model:MODEL,

                instructions:
                "تو رهام هستی. فقط خود جواب سؤال را بده. هیچ مقدمه، عنوان، توضیح اضافه یا عبارت‌هایی مثل «پاسخ رهام» اضافه نکن.",

                input:question

            })
        }
    );


    if(!response.ok){

        throw new Error(
            "خطا در اتصال به هوش مصنوعی"
        );

    }


    const data =
    await response.json();


    /*
    خروجی متن
    */

    if(data.output_text){

        return data.output_text.trim();

    }


    return "پاسخی دریافت نشد.";

}


/*
ارسال
*/

async function sendMessage(){

    const question =
    input.value.trim();

    if(!question)
    return;

    addMessage(
        question,
        "user"
    );

    input.value="";

    send.disabled=true;

    const loading =
    document.createElement("div");

    loading.className=
    "message ai";

    loading.id=
    "loading";

    loading.textContent=
    "در حال پاسخ...";

    messages.appendChild(
        loading
    );

    messages.scrollTop=
    messages.scrollHeight;


    try{

        const answer =
        await askRoham(
            question
        );

        loading.remove();

        addMessage(
            answer,
            "ai"
        );

    }
    catch(error){

        loading.remove();

        addMessage(
            "خطا در دریافت پاسخ.",
            "ai"
        );

        console.error(error);

    }


    send.disabled=false;

    input.focus();
}


/*
دکمه ارسال
*/

send.addEventListener(
    "click",
    sendMessage
);


/*
Enter
*/

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key==="Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>
</html>
