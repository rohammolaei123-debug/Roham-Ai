```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roham AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #0b1020;
    color: white;
}

button,
input {
    font-family: inherit;
}

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.loginBox {
    width: 100%;
    max-width: 430px;
    background: #151c32;
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
}

.logo {
    font-size: 38px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    color: #aab3ca;

}

.phoneInput {
    width: 100%;
    padding: 15px;
    border: 1px solid #303a58;
    border-radius: 13px;
    background: #0e1528;
    color: white;
    outline: none;
    font-size: 16px;
    direction: ltr;
    text-align: left;
}

.phoneInput:focus {
    border-color: #5d7cff;
}

.mainBtn,
.laterBtn {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 13px;
    cursor: pointer;
    font-size: 16px;
}

.mainBtn {
    background: #5d7cff;
    color: white;
}

.mainBtn:hover {
    background: #4b69e8;
}

.laterBtn {
    background: #252e49;
    color: white;
}

.laterBtn:hover {
    background: #303b5c;
}

.error {
    color: #ff7b7b;
    margin-top: 10px;
    min-height: 20px;
}

#chatScreen {
    display: none;
    height: 100vh;
    flex-direction: column;
}

.header {
    height: 65px;
    background: #151c32;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #252e49;
}

.headerTitle {
    font-size: 20px;
    font-weight: bold;
}

.headerUser {
    color: #9da8c2;

}

#messages {
    flex: 1;

}

.message {
    max-width: 850px;

}

    background: #354263;
}

.inputArea {
    padding: 15px;

}

.inputBox {
    max-width: 850px;
    margin: auto;
    display: flex;

}

.messageInput {
    flex: 1;
    resize: none;

.sendBtn:hover {
    background: #4b69e8;

    margin-top: 15px;

}

.typing {
    color: #9da8c2;

}
</style>
</head>

<body>

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">Roham AI</div>

        <div class="subtitle">
            برای شروع، شماره تلفنت را وارد کن
        </div>

        <input
            id="phoneInput"
            class="phoneInput"
            type="tel"
            placeholder="مثلاً 09123456789"
            autocomplete="tel"
        >

        <button class="mainBtn" onclick="loginWithPhone()">
            وارد کردن شماره و شروع
        </button>

        <button class="laterBtn" onclick="continueWithoutPhone()">
            بعداً شماره‌ام را وارد می‌کنم
        </button>

        <div id="loginError" class="error"></div>

        <div class="smallNote">
            اگر شماره‌ات را وارد کنی، تاریخچه گفت‌وگوها روی همین مرورگر
            برایت نگهداری می‌شود.
        </div>

    </div>

</div>

<div id="chatScreen">

    <div class="header">

        <div>
            <div class="headerTitle">Roham AI</div>
            <div id="headerUser" class="headerUser"></div>
        </div>

    </div>

    <div id="messages"></div>

    <div class="inputArea">

        <div class="inputBox">

            <textarea
                id="messageInput"
                class="messageInput"
                placeholder="پیامت را برای رهام بنویس..."
                onkeydown="handleKey(event)"
            ></textarea>

            <button class="sendBtn" onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</div>

<script>

let currentPhone = null;
let memoryEnabled = false;

function loginWithPhone() {

    const input = document.getElementById("phoneInput");
    const error = document.getElementById("loginError");

    let phone = input.value.trim();

    phone = phone.replace(/\s+/g, "");

    if (!/^09\d{9}$/.test(phone)) {

        error.textContent =
            "لطفاً یک شماره موبایل معتبر وارد کن.";

        return;
    }

    currentPhone = phone;
    memoryEnabled = true;

    localStorage.setItem(
        "roham_current_phone",
        phone
    );

    openChat();
}

function continueWithoutPhone() {

    currentPhone = null;
    memoryEnabled = false;

    openChat();
}

function openChat() {

    document.getElementById("loginScreen").style.display =
        "none";

    document.getElementById("chatScreen").style.display =
        "flex";

    const headerUser =
        document.getElementById("headerUser");

    if (memoryEnabled) {

        headerUser.textContent =
            "حافظه فعال • " + currentPhone;

    } else {

        headerUser.textContent =
            "حالت بدون حافظه";

    }

    loadHistory();
}

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;

    addUserMessage(text);

    input.value = "";

    showTyping();

    setTimeout(() => {

        removeTyping();

        const answer =
            "سلام! من رهام هستم.\n\n" +
            "پیامت را دریافت کردم. این بخش آماده است تا به هوش مصنوعی واقعی متصل شود.";

        addAIMessage(answer);

    }, 700);
}

function addUserMessage(text, save = true) {

    const container =
        document.getElementById("messages");

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";

    wrapper.innerHTML = `
        <div class="userMessage"></div>
    `;

    wrapper.querySelector(".userMessage").textContent =
        text;

    container.appendChild(wrapper);

    scrollToBottom();

    if (save && memoryEnabled) {

        saveMessage("user", text);
    }
}

function addAIMessage(text, save = true) {

    const container =
        document.getElementById("messages");

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";

    wrapper.innerHTML = `
        <div class="aiMessage">

            <div class="aiText"></div>

            <button class="readBtn">
                خواندن متن
            </button>

        </div>
    `;

    const textElement =
        wrapper.querySelector(".aiText");

    const readButton =
        wrapper.querySelector(".readBtn");

    textElement.textContent = text;

    readButton.onclick = function () {

        readText(text, readButton);

    };

    container.appendChild(wrapper);

    scrollToBottom();

    if (save && memoryEnabled) {

        saveMessage("ai", text);
    }
}

function readText(text, button) {

    if (!("speechSynthesis" in window)) {

        alert(
            "مرورگر شما از خواندن متن پشتیبانی نمی‌کند."
        );

        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "fa-IR";

    utterance.rate = 0.95;

    utterance.pitch = 1;

    button.textContent =
        "توقف خواندن";

    utterance.onend = function () {

        button.textContent =
            "خواندن متن";
    };

    utterance.onerror = function () {

        button.textContent =
            "خواندن متن";
    };

    button.onclick = function () {

        speechSynthesis.cancel();

        button.textContent =
            "خواندن متن";

        button.onclick = function () {

            readText(text, button);

        };
    };

    speechSynthesis.speak(utterance);
}

function saveMessage(role, text) {

    if (
        !memoryEnabled ||
        !currentPhone
    ) return;

    const key =
        "roham_history_" + currentPhone;

    let history =
        JSON.parse(
            localStorage.getItem(key) || "[]"
        );

    history.push({

        role: role,
        text: text,
        time: Date.now()

    });

    localStorage.setItem(
        key,
        JSON.stringify(history)
    );
}

function loadHistory() {

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    if (
        !memoryEnabled ||
        !currentPhone
    ) return;

    const key =
        "roham_history_" + currentPhone;

    const history =
        JSON.parse(
            localStorage.getItem(key) || "[]"
        );

    history.forEach(message => {

        if (message.role === "user") {

            addUserMessage(
                message.text,
                false
            );
        }

        if (message.role === "ai") {

            addAIMessage(
                message.text,
                false
            );
        }

    });
}

function showTyping() {

    const container =
        document.getElementById("messages");

    const wrapper =
        document.createElement("div");

    wrapper.id =
        "typingMessage";

    wrapper.className =
        "message";

    wrapper.innerHTML = `
        <div class="aiMessage">
            <div class="typing">
                رهام در حال پاسخ دادن است...
            </div>
        </div>
    `;

    container.appendChild(wrapper);

    scrollToBottom();
}

function removeTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {

        typing.remove();
    }
}

function scrollToBottom() {

    const container =
        document.getElementById("messages");

    container.scrollTop =
        container.scrollHeight;
}

window.addEventListener(
    "load",
    function () {

        const savedPhone =
            localStorage.getItem(
                "roham_current_phone"
            );

        if (savedPhone) {

            document.getElementById(
                "phoneInput"
            ).value = savedPhone;

        }

    }
);

</script>

</body>
</html>
