```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roham AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #0b1020;
    color: white;
}

#chatScreen {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    height: 65px;
    background: #151c32;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #252e49;
}

.headerTitle {
    font-size: 21px;
    font-weight: bold;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 850px;
    margin: 0 auto 18px;
}

.userMessage {
    background: #263252;
    padding: 13px 16px;
    border-radius: 17px 17px 4px 17px;
    margin-left: 10%;
    white-space: pre-wrap;
}

.aiMessage {
    background: #151c32;
    border: 1px solid #27304a;
    padding: 16px;
    border-radius: 17px 17px 17px 4px;
}

.aiText {
    line-height: 1.9;
    white-space: pre-wrap;
}

.readBtn {
    margin-top: 12px;
    padding: 9px 14px;
    border: none;
    border-radius: 9px;
    background: #252e49;
    color: white;
    cursor: pointer;
}

.readBtn:hover {
    background: #354263;
}

.inputArea {
    padding: 15px;
    background: #10172a;
    border-top: 1px solid #252e49;
}

.inputBox {
    max-width: 850px;
    margin: auto;
    display: flex;
    gap: 10px;
}

.messageInput {
    flex: 1;
    resize: none;
    min-height: 50px;
    max-height: 150px;
    padding: 14px;
    border: 1px solid #303a58;
    border-radius: 14px;
    background: #151c32;
    color: white;
    outline: none;
    font-size: 15px;
}

.sendBtn {
    width: 60px;
    border: none;
    border-radius: 14px;
    background: #5d7cff;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.sendBtn:hover {
    background: #4b69e8;
}

.typing {
    color: #9da8c2;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="chatScreen">

    <div class="header">
        <div class="headerTitle">Roham AI</div>
    </div>

    <div id="messages"></div>

    <div class="inputArea">

        <div class="inputBox">

            <textarea
                id="messageInput"
                class="messageInput"
                placeholder="پیامت را برای رهام بنویس..."
                onkeydown="handleKey(event)"
            ></textarea>

            <button class="sendBtn" onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</div>

<script>

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

    }

}


function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;

    addUserMessage(text);

    input.value = "";

    showTyping();

    /*
      این قسمت را باید به API هوش مصنوعی
      مورد استفاده پروژه متصل کنی.
    */

    setTimeout(function() {

        removeTyping();

        const answer =
            "سلام! من رهام هستم.\n\n" +
            "پیامت را دریافت کردم.";

        addAIMessage(answer);

    }, 700);

}


function addUserMessage(text) {

    const container =
        document.getElementById("messages");

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";

    const message =
        document.createElement("div");

    message.className = "userMessage";

    message.textContent = text;

    wrapper.appendChild(message);

    container.appendChild(wrapper);

    scrollToBottom();

}


function addAIMessage(text) {

    const container =
        document.getElementById("messages");

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";

    const box =
        document.createElement("div");

    box.className = "aiMessage";

    const textElement =
        document.createElement("div");

    textElement.className = "aiText";

    textElement.textContent = text;

    const readButton =
        document.createElement("button");

    readButton.className = "readBtn";

    readButton.textContent = "خواندن متن";

    readButton.onclick = function() {

        readText(text, readButton);

    };

    box.appendChild(textElement);

    box.appendChild(readButton);

    wrapper.appendChild(box);

    container.appendChild(wrapper);

    scrollToBottom();

}


function readText(text, button) {

    if (!("speechSynthesis" in window)) {

        alert(
            "مرورگر شما از خواندن متن پشتیبانی نمی‌کند."
        );

        return;

    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "fa-IR";

    speech.rate = 0.95;

    speech.pitch = 1;

    button.textContent = "توقف خواندن";

    speech.onend = function() {

        button.textContent = "خواندن متن";

    };

    speech.onerror = function() {

        button.textContent = "خواندن متن";

    };

    button.onclick = function() {

        speechSynthesis.cancel();

        button.textContent = "خواندن متن";

        button.onclick = function() {

            readText(text, button);

        };

    };

    speechSynthesis.speak(speech);

}


function showTyping() {

    const container =
        document.getElementById("messages");

    const wrapper =
        document.createElement("div");

    wrapper.id = "typingMessage";

    wrapper.className = "message";

    wrapper.innerHTML = `
        <div class="aiMessage">
            <div class="typing">
                رهام در حال پاسخ دادن است...
            </div>
        </div>
    `;

    container.appendChild(wrapper);

    scrollToBottom();

}


function removeTyping() {

    const typing =
        document.getElementById("typingMessage");

    if (typing) {

        typing.remove();

    }

}


function scrollToBottom() {

    const container =
        document.getElementById("messages");

    container.scrollTop =
        container.scrollHeight;

}

</script>

</body>
</html>
