<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رهام</title>
<style>
  :root{
    --ink:#1c1a17;
    --paper:#f7f3ec;
    --line:#d8cfbf;
    --brass:#8a6d3b;
    --brass-deep:#5f4a24;
    --panel:#fffdf9;
    --bubble-user:#e7ded0;
    --bubble-ai:#ffffff;
    --danger:#8a3324;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Vazirmatn","Tahoma",sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  header{
    border-bottom:2px solid var(--ink);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    background:var(--paper);
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{font-size:1.5rem;margin:0;}
  .brand span{font-size:.78rem;color:var(--brass-deep);border:1px solid var(--brass);border-radius:999px;padding:2px 10px;}

  .tabs{display:flex;gap:8px;}
  .tab-btn{
    padding:8px 16px;
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
    font-size:.9rem;
  }
  .tab-btn.active{background:var(--ink);color:var(--paper);}

  main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

  #chatTab{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:78%;padding:10px 14px;line-height:1.7;font-size:.96rem;white-space:pre-wrap;}
  .msg.user{align-self:flex-start;background:var(--bubble-user);}
  .msg.ai{align-self:flex-end;background:var(--bubble-ai);border:1px solid var(--line);}
  .msg.sys{align-self:center;color:#8a8371;font-size:.82rem;background:none;}

  .chat-input-row{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;background:var(--panel);}
  #chatInput{flex:1;padding:12px;font-family:inherit;font-size:1rem;border:1px solid var(--line);resize:none;min-height:48px;max-height:140px;}
  #chatInput:focus{outline:2px solid var(--brass);outline-offset:1px;}

  button.send{font-family:inherit;font-size:1rem;padding:0 24px;background:var(--ink);color:var(--paper);border:none;cursor:pointer;}
  button.send:hover:not(:disabled){background:var(--brass-deep);}
  button.send:disabled{background:#cfc7b8;color:#7a7365;cursor:not-allowed;}

  #imageTab{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:20px;}
  .panel{background:var(--panel);border:1px solid var(--line);padding:20px;margin-bottom:20px;}
  label{display:block;font-size:.9rem;margin-bottom:8px;color:#4a4438;}
  textarea.imgPrompt{width:100%;min-height:80px;font-family:inherit;font-size:1rem;padding:12px;border:1px solid var(--line);}
  .row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;align-items:center;}
  select{padding:10px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:.9rem;}
  .quota{font-size:.85rem;color:#5b5448;margin-bottom:10px;}
  .quota b{color:var(--ink);font-size:1.05rem;}
  .status{margin-top:12px;font-size:.9rem;min-height:1.2em;}
  .status.wait{color:var(--danger);}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  figure{margin:0;border:1px solid var(--line);background:#fff;padding:8px;}
  figure img{width:100%;display:block;background:#eee;}
  figcaption{font-size:.78rem;color:#6b6455;margin-top:6px;line-height:1.4;}
  .empty{color:#8a8371;font-size:.9rem;padding:20px 0;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>رهام</h1><span>هوش مصنوعی</span></div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="chat">چت</button>
    <button class="tab-btn" data-tab="image">ساخت تصویر</button>
  </div>
</header>

<main>
  <div id="chatTab">
    <div id="messages">
      <div class="msg sys">با رهام چت کن. رهام از یک سرویس هوش مصنوعی رایگان استفاده می‌کند.</div>
    </div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="پیامت را بنویس..."></textarea>
      <button class="send" id="sendBtn">ارسال</button>
    </div>
  </div>

  <div id="imageTab">
    <div class="panel">
      <div class="quota" id="quotaBox">در حال بارگذاری...</div>
      <label for="imgPrompt">توضیح تصویری که می‌خواهی رهام بسازد</label>
      <textarea class="imgPrompt" id="imgPrompt" placeholder="مثلاً: یک جنگل مه‌آلود در سپیده‌دم با نور طلایی"></textarea>
      <div class="row">
        <select id="ratio">
          <option value="1024x1024">مربع</option>
          <option value="1024x768">افقی</option>
          <option value="768x1024">عمودی</option>
        </select>
        <button class="send" id="genBtn">ساخت تصویر</button>
      </div>
      <div class="status" id="statusLine"></div>
    </div>
    <div id="gallery" class="gallery"></div>
  </div>
</main>

<script>
(function(){
  "use strict";

  var tabBtns = document.querySelectorAll(".tab-btn");
  var chatTab = document.getElementById("chatTab");
  var imageTab = document.getElementById("imageTab");
  tabBtns.forEach(function(b){
    b.addEventListener("click", function(){
      tabBtns.forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      if (b.dataset.tab === "chat"){
        chatTab.style.display = "flex";
        imageTab.style.display = "none";
      } else {
        chatTab.style.display = "none";
        imageTab.style.display = "flex";
      }
    });
  });

  var messagesEl = document.getElementById("messages");
  var chatInput = document.getElementById("chatInput");
  var sendBtn = document.getElementById("sendBtn");
  var history = [
    { role: "system", content: "تو رهام هستی، یک دستیار هوش مصنوعی فارسی‌زبان، دوستانه و مفید. همیشه به فارسی پاسخ بده مگر کاربر زبان دیگری بخواهد." }
  ];

  function addBubble(text, cls){
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return d;
  }

  function sendMessage(){
    var text = chatInput.value.trim();
    if (!text) return;
    addBubble(text, "user");
    history.push({ role: "user", content: text });
    chatInput.value = "";
    sendBtn.disabled = true;
    var thinking = addBubble("رهام در حال نوشتن پاسخ است...", "sys");

    fetch("https://text.pollinations.ai/openai/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "openai", messages: history, temperature: 0.7 })
    })
    .then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function(data){
      thinking.remove();
      var reply = data && data.choices && data.choices[0] &&
                  data.choices[0].message && data.choices[0].message.content;
      if (!reply) throw new Error("پاسخ خالی بود");
      addBubble(reply, "ai");
      history.push({ role: "assistant", content: reply });
    })
    .catch(function(err){
      thinking.remove();
      addBubble(
        "اتصال به سرویس هوش مصنوعی برقرار نشد (" + err.message + "). این برنامه از یک سرویس رایگان بیرونی استفاده می‌کند که گاهی محدودیت نرخ یا قطعی موقت دارد؛ کمی بعد دوباره امتحان کن.",
        "sys"
      );
    })
    .finally(function(){ sendBtn.disabled = false; });
  }

  sendBtn.addEventListener("click", sendMessage);
  chatInput.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  var LIMIT = 10;
  var WINDOW_MS = 12 * 60 * 60 * 1000;
  var STORAGE_KEY = "raham_generations_v1";
  var HISTORY_KEY = "raham_gallery_v1";

  var promptEl = document.getElementById("imgPrompt");
  var ratioEl = document.getElementById("ratio");
  var genBtn = document.getElementById("genBtn");
  var statusLine = document.getElementById("statusLine");
  var quotaBox = document.getElementById("quotaBox");
  var gallery = document.getElementById("gallery");

  function loadTimestamps(){
    try{
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      var cutoff = Date.now() - WINDOW_MS;
      return raw.filter(function(t){ return t > cutoff; });
    }catch(e){ return []; }
  }
  function saveTimestamps(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
  function loadGallery(){
    try{ return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }
    catch(e){ return []; }
  }
  function saveGallery(list){ localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(-40))); }

  function msToClock(ms){
    var totalMin = Math.ceil(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    if (h <= 0) return m + " دقیقه";
    return h + " ساعت و " + m + " دقیقه";
  }

  function renderQuota(){
    var timestamps = loadTimestamps();
    var remaining = LIMIT - timestamps.length;
    if (remaining > 0){
      quotaBox.innerHTML = "<b>" + remaining + "</b> از " + LIMIT + " تصویر باقی‌مانده در این ۱۲ ساعت";
      genBtn.disabled = false;
      statusLine.className = "status";
      statusLine.textContent = "";
    } else {
      var oldest = Math.min.apply(null, timestamps);
      var waitMs = (oldest + WINDOW_MS) - Date.now();
      quotaBox.innerHTML = "<b>۰</b> از " + LIMIT + " تصویر باقی‌مانده";
      genBtn.disabled = true;
      statusLine.className = "status wait";
      statusLine.textContent = "سقف ۱۰ تصویر پر شده. حدود " + msToClock(Math.max(waitMs,0)) + " دیگر دوباره می‌توانی بسازی.";
    }
    return remaining;
  }

  function renderGallery(){
    var items = loadGallery();
    gallery.innerHTML = "";
    if (items.length === 0){
      gallery.innerHTML = '<div class="empty">هنوز تصویری ساخته نشده است.</div>';
      return;
    }
    items.slice().reverse().forEach(function(item){
      var fig = document.createElement("figure");
      var img = document.createElement("img");
      img.src = item.url;
      img.alt = item.prompt;
      img.loading = "lazy";
      var cap = document.createElement("figcaption");
      cap.textContent = item.prompt;
      fig.appendChild(img);
      fig.appendChild(cap);
      gallery.appendChild(fig);
    });
  }

  function buildImageUrl(prompt, size){
    var parts = size.split("x");
    var seed = Date.now();
    return "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
           "?width=" + parts[0] + "&height=" + parts[1] + "&seed=" + seed + "&nologo=true";
  }

  function generateImage(){
    var prompt = promptEl.value.trim();
    if (!prompt){
      statusLine.className = "status wait";
      statusLine.textContent = "لطفاً ابتدا توضیح تصویر را بنویس.";
      return;
    }
    var remaining = renderQuota();
    if (remaining <= 0) return;

    genBtn.disabled = true;
    statusLine.className = "status";
    statusLine.textContent = "رهام در حال ساختن تصویر است...";

    var url = buildImageUrl(prompt, ratioEl.value);
    var img = new Image();
    img.onload = function(){
      var timestamps = loadTimestamps();
      timestamps.push(Date.now());
      saveTimestamps(timestamps);
      var items = loadGallery();
      items.push({ prompt: prompt, url: url, at: Date.now() });
      saveGallery(items);
      renderGallery();
      renderQuota();
      statusLine.className = "status";
      statusLine.textContent = "تصویر ساخته شد.";
    };
    img.onerror = function(){
      statusLine.className = "status wait";
      statusLine.textContent = "ساخت تصویر با خطا مواجه شد. دوباره تلاش کن.";
      renderQuota();
    };
    img.src = url;
  }

  genBtn.addEventListener("click", generateImage);
  renderQuota();
  renderGallery();
  setInterval(renderQuota, 30000);
})();
</script>
</body>
</html>
