<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رهام</title>

<style>
:root{
  --ink:#1c1a17;
  --paper:#f7f3ec;
  --line:#d8cfbf;
  --brass:#8a6d3b;
  --brass-deep:#5f4a24;
  --panel:#fffdf9;
  --bubble-user:#e7ded0;
  --bubble-ai:#ffffff;
  --danger:#8a3324;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  height:100%;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Vazirmatn","Tahoma",sans-serif;
  display:flex;
  flex-direction:column;
  height:100vh;
}

header{
  border-bottom:2px solid var(--ink);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--paper);
}

.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}

.brand h1{
  font-size:1.5rem;
  margin:0;
}

.brand span{
  font-size:.78rem;
  color:var(--brass-deep);
  border:1px solid var(--brass);
  border-radius:999px;
  padding:2px 10px;
}

main{
  flex:1;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

#chatTab{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.msg{
  max-width:78%;
  padding:10px 14px;
  line-height:1.7;
  font-size:.96rem;
  white-space:pre-wrap;
}

.msg.user{
  align-self:flex-start;
  background:var(--bubble-user);
}

.msg.ai{
  align-self:flex-end;
  background:var(--bubble-ai);
  border:1px solid var(--line);
}

.msg.sys{
  align-self:center;
  color:#8a8371;
  font-size:.82rem;
  background:none;
}

.chat-input-row{
  border-top:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  gap:10px;
  background:var(--panel);
  align-items:flex-end;
}

#chatInput{
  flex:1;
  padding:12px;
  font-family:inherit;
  font-size:1rem;
  border:1px solid var(--line);
  resize:none;
  min-height:48px;
  max-height:140px;
}

#chatInput:focus{
  outline:2px solid var(--brass);
  outline-offset:1px;
}

button.send{
  font-family:inherit;
  font-size:1rem;
  padding:12px 24px;
  background:var(--ink);
  color:var(--paper);
  border:none;
  cursor:pointer;
  min-height:48px;
}

button.send:hover:not(:disabled){
  background:var(--brass-deep);
}

button.send:disabled{
  background:#cfc7b8;
  color:#7a7365;
  cursor:not-allowed;
}

.image-upload{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}

#imageInput{
  display:none;
}

.upload-btn{
  font-family:inherit;
  font-size:.9rem;
  padding:12px 16px;
  background:transparent;
  color:var(--ink);
  border:1px solid var(--ink);
  cursor:pointer;
  min-height:48px;
}

.upload-btn:hover{
  background:var(--ink);
  color:var(--paper);
}

.preview{
  display:none;
  position:absolute;
  bottom:85px;
  right:20px;
  background:var(--panel);
  border:1px solid var(--line);
  padding:8px;
  max-width:150px;
}

.preview img{
  width:130px;
  max-height:130px;
  object-fit:contain;
  display:block;
}

.preview-text{
  font-size:.75rem;
  margin-top:5px;
  color:#6b6455;
  text-align:center;
}

@media(max-width:600px){
  .chat-input-row{
    padding:10px;
    gap:6px;
  }

  button.send{
    padding:12px 15px;
  }

  .upload-btn{
    padding:12px 10px;
  }

  #messages{
    padding:12px;
  }

  .msg{
    max-width:88%;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <h1>رهام</h1>
    <span>هوش مصنوعی</span>
  </div>
</header>

<main>

  <div id="chatTab">

    <div id="messages">
      <div class="msg sys">
        با رهام چت کن. می‌توانی عکس هم برای رهام بفرستی تا درباره آن صحبت کند.
      </div>
    </div>

    <div class="preview" id="preview">
      <img id="previewImg" src="" alt="پیش‌نمایش">
      <div class="preview-text">عکس انتخاب شده</div>
    </div>

    <div class="chat-input-row">

      <div class="image-upload">
        <label for="imageInput" class="upload-btn">
          ارسال عکس
        </label>
        <input
          id="imageInput"
          type="file"
          accept="image/png,image/jpeg,image/webp"
        >
      </div>

      <textarea
        id="chatInput"
        placeholder="پیامت را بنویس..."
      ></textarea>

      <button class="send" id="sendBtn">
        ارسال
      </button>

    </div>

  </div>

</main>

<script>
(function(){

"use strict";

var messagesEl = document.getElementById("messages");
var chatInput = document.getElementById("chatInput");
var sendBtn = document.getElementById("sendBtn");

var imageInput = document.getElementById("imageInput");
var preview = document.getElementById("preview");
var previewImg = document.getElementById("previewImg");

var selectedImage = null;

var history = [
  {
    role:"system",
    content:
    "تو رهام هستی، یک دستیار هوش مصنوعی فارسی‌زبان، دوستانه و مفید. " +
    "همیشه به فارسی پاسخ بده مگر کاربر زبان دیگری بخواهد. " +
    "اگر کاربر درباره سازنده، خالق یا کسی که تو را ساخته پرسید، " +
    "پاسخ بده: من رو رهام مولایی ساخته. " +
    "تو قابلیت ساخت یا تولید تصویر نداری و فقط می‌توانی تصاویر ارسال‌شده توسط کاربر را تحلیل و درباره آن‌ها صحبت کنی."
  }
];

function addBubble(text, cls){

  var d = document.createElement("div");

  d.className = "msg " + cls;

  d.textContent = text;

  messagesEl.appendChild(d);

  messagesEl.scrollTop = messagesEl.scrollHeight;

  return d;
}


/* انتخاب عکس */

imageInput.addEventListener("change", function(){

  var file = imageInput.files[0];

  if(!file){
    selectedImage = null;
    preview.style.display = "none";
    return;
  }

  if(!file.type.startsWith("image/")){
    addBubble("لطفاً فقط یک فایل تصویری انتخاب کن.", "sys");
    imageInput.value = "";
    return;
  }

  var reader = new FileReader();

  reader.onload = function(e){

    selectedImage = e.target.result;

    previewImg.src = selectedImage;

    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* تشخیص سؤال درباره سازنده */

function isCreatorQuestion(text){

  var t = text
    .replace(/ي/g,"ی")
    .replace(/ك/g,"ک")
    .trim()
    .toLowerCase();

  var questions = [
    "کی تورو ساخته",
    "کی تو رو ساخته",
    "چه کسی تورو ساخته",
    "چه کسی تو رو ساخته",
    "سازندت کیه",
    "سازنده‌ت کیه",
    "سازنده ات کیه",
    "سازنده تو کیه",
    "خالق تو کیه",
    "چه کسی ساختت",
    "کی ساختت",
    "تو رو کی ساخته",
    "تورو کی ساخته",
    "تو را چه کسی ساخته",
    "تو را کی ساخته",
    "چه کسی تو را ساخته",
    "کی تو را ساخته",
    "مالک تو کیه"
  ];

  for(var i=0;i<questions.length;i++){

    if(t.includes(questions[i])){
      return true;
    }

  }

  return false;
}


/* ارسال پیام */

function sendMessage(){

  var text = chatInput.value.trim();

  if(!text && !selectedImage){
    return;
  }


  /* پاسخ مستقیم درباره سازنده */

  if(text && isCreatorQuestion(text) && !selectedImage){

    addBubble(text,"user");

    chatInput.value = "";

    setTimeout(function(){

      addBubble(
        "من رو رهام مولایی ساخته.",
        "ai"
      );

    },200);

    return;
  }


  /* پیام کاربر */

  if(text){

    addBubble(text,"user");

  }else{

    addBubble("این عکس رو بررسی کن.", "user");

  }


  sendBtn.disabled = true;

  var thinking = addBubble(
    "رهام در حال بررسی است...",
    "sys"
  );


  /*
    اگر عکس انتخاب شده باشد،
    پیام به شکل multimodal ارسال می‌شود.
  */

  var userMessage;


  if(selectedImage){

    userMessage = {
      role:"user",
      content:[
        {
          type:"text",
          text:text || "این عکس را بررسی کن و درباره آن توضیح بده."
        },
        {
          type:"image_url",
          image_url:{
            url:selectedImage
          }
        }
      ]
    };

  }else{

    userMessage = {
      role:"user",
      content:text
    };

  }


  history.push(userMessage);


  fetch("https://text.pollinations.ai/openai/chat/completions",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      model:"openai",

      messages:history,

      temperature:0.7

    })

  })

  .then(function(res){

    if(!res.ok){

      throw new Error("HTTP " + res.status);

    }

    return res.json();

  })

  .then(function(data){

    thinking.remove();

    var reply =
      data &&
      data.choices &&
      data.choices[0] &&
      data.choices[0].message &&
      data.choices[0].message.content;


    if(!reply){

      throw new Error("پاسخ خالی بود");

    }


    /*
      اگر پاسخ مدل آرایه باشد،
      متن آن استخراج می‌شود.
    */

    if(Array.isArray(reply)){

      reply = reply.map(function(part){

        if(typeof part === "string"){
          return part;
        }

        if(part && part.text){
          return part.text;
        }

        return "";

      }).join("");

    }


    addBubble(reply,"ai");

    history.push({
      role:"assistant",
      content:reply
    });

  })

  .catch(function(err){

    thinking.remove();

    addBubble(
      "اتصال به سرویس هوش مصنوعی برقرار نشد (" +
      err.message +
      "). کمی بعد دوباره امتحان کن.",
      "sys"
    );

    /*
      اگر درخواست ناموفق بود،
      پیام آخر از history حذف شود.
    */

    history.pop();

  })

  .finally(function(){

    sendBtn.disabled = false;

  });


  /* پاک کردن عکس */

  selectedImage = null;

  imageInput.value = "";

  preview.style.display = "none";

}


/* دکمه ارسال */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* Enter برای ارسال */

chatInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter" && !e.shiftKey){

      e.preventDefault();

      sendMessage();

    }

  }
);

})();
</script>

</body>
</html>
