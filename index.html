<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roham AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
flex-direction:column
}

header{
height:64px;
display:flex;
align-items:center;
justify-content:center;
border-bottom:1px solid #222;
font-size:22px;
font-weight:bold
}

#chat{
flex:1;
overflow-y:auto;
padding:20px
}

.message{
max-width:850px;
margin:0 auto 20px;
line-height:2;
white-space:pre-wrap;
word-break:break-word
}

.user{
color:#888
}

.ai{
color:#fff
}

.bottom{
display:flex;
gap:10px;
padding:14px;
border-top:1px solid #222
}

textarea{
flex:1;
background:#111;
color:#fff;
border:1px solid #333;
border-radius:12px;
padding:13px;
font-size:16px;
resize:none;
outline:none
}

button{
width:85px;
border:0;
border-radius:12px;
background:#fff;
color:#000;
font-size:16px;
cursor:pointer
}

button:disabled{
opacity:.5
}
</style>
</head>

<body>

<header>Roham AI</header>

<div id="chat"></div>

<div class="bottom">
<textarea
id="input"
rows="2"
placeholder="سؤالت را بنویس..."
></textarea>

<button id="send">ارسال</button>
</div>

<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text,type){

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
}


function creatorQuestion(q){

    q = q
    .replace(/[؟?!.,،]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();

    const words = [
        "کی تورو ساخته",
        "کی تو رو ساخته",
        "چه کسی تو را ساخته",
        "چه کسی تورو ساخته",
        "چه کسی تو رو ساخته",
        "سازنده تو کیه",
        "سازندت کیه",
        "سازنده ات کیه",
        "تو رو کی ساخته",
        "تورو کی ساخته",
        "تو را چه کسی ساخته"
    ];

    return words.some(x => q.includes(x));
}


async function ask(){

    const question = input.value.trim();

    if(!question) return;

    addMessage(question,"user");

    input.value = "";

    send.disabled = true;

    /*
      پاسخ ثابت برای سازنده
    */

    if(creatorQuestion(question)){

        addMessage(
            "رهام مولایی فر ساخته",
            "ai"
        );

        send.disabled = false;
        input.focus();

        return;
    }

    const answer = addMessage(
        "در حال پاسخ...",
        "ai"
    );

    try{

        const prompt =
        "تو Roham AI هستی. " +
        "به سؤال کاربر مستقیم جواب بده. " +
        "پاسخ را به زبان سؤال بده. " +
        "هیچ عنوان یا توضیح اضافه‌ای قبل از جواب نده. " +
        "اگر سؤال درباره سازنده تو بود، پاسخ باید «رهام مولایی فر ساخته» باشد." +
        "\n\nسؤال:\n" +
        question;

        const url =
        "https://text.pollinations.ai/" +
        encodeURIComponent(prompt) +
        "?model=openai";

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("API ERROR");
        }

        const text = await response.text();

        if(!text.trim()){
            throw new Error("EMPTY");
        }

        answer.textContent = text.trim();

    }catch(error){

        console.error(error);

        answer.textContent =
        "فعلاً اتصال به سرویس هوش مصنوعی برقرار نشد. دوباره امتحان کن.";

    }

    send.disabled = false;
    input.focus();
}


send.addEventListener("click",ask);


input.addEventListener("keydown",function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        ask();
    }

});

</script>

</body>
</html>
