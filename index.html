```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رهام</title>

<style>
:root{
  --ink:#1c1a17;
  --paper:#f7f3ec;
  --line:#d8cfbf;
  --brass:#8a6d3b;
  --brass-deep:#5f4a24;
  --panel:#fffdf9;
  --bubble-user:#e7ded0;
  --bubble-ai:#ffffff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  height:100%;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Vazirmatn","Tahoma",sans-serif;
  display:flex;
  flex-direction:column;
  height:100vh;
}

header{
  border-bottom:2px solid var(--ink);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--paper);
}

.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}

.brand h1{
  font-size:1.5rem;
  margin:0;
}

.brand span{
  font-size:.78rem;
  color:var(--brass-deep);
  border:1px solid var(--brass);
  border-radius:999px;
  padding:2px 10px;
}

main{
  flex:1;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

#chatTab{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.msg{
  max-width:78%;
  padding:10px 14px;
  line-height:1.7;
  font-size:.96rem;
  white-space:pre-wrap;
}

.msg.user{
  align-self:flex-start;
  background:var(--bubble-user);
}

.msg.ai{
  align-self:flex-end;
  background:var(--bubble-ai);
  border:1px solid var(--line);
}

.msg.sys{
  align-self:center;
  color:#8a8371;
  font-size:.82rem;
}

.chat-input-row{
  border-top:1px solid var(--line);
  padding:14px 20px;
  display:flex;
  gap:10px;
  background:var(--panel);
  align-items:flex-end;
}

#chatInput{
  flex:1;
  padding:12px;
  font-family:inherit;
  font-size:1rem;
  border:1px solid var(--line);
  resize:none;
  min-height:48px;
  max-height:140px;
}

#chatInput:focus{
  outline:2px solid var(--brass);
  outline-offset:1px;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.send{
  font-size:1rem;
  padding:0 24px;
  min-height:48px;
  background:var(--ink);
  color:var(--paper);
  border:none;
}

.send:hover:not(:disabled){
  background:var(--brass-deep);
}

.send:disabled{
  background:#cfc7b8;
  color:#7a7365;
  cursor:not-allowed;
}

.upload-label{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:0 15px;
  border:1px solid var(--ink);
  background:transparent;
  cursor:pointer;
  white-space:nowrap;
}

.upload-label:hover{
  background:var(--ink);
  color:var(--paper);
}

#imageInput{
  display:none;
}

.image-preview{
  display:none;
  position:absolute;
  bottom:80px;
  right:20px;
  width:150px;
  padding:8px;
  background:var(--panel);
  border:1px solid var(--line);
}

.image-preview img{
  width:100%;
  max-height:130px;
  object-fit:contain;
  display:block;
}

.image-preview button{
  width:100%;
  margin-top:6px;
  padding:5px;
  border:1px solid var(--line);
  background:transparent;
}

@media(max-width:600px){

  .chat-input-row{
    padding:10px;
    gap:6px;
  }

  .send{
    padding:0 15px;
  }

  .upload-label{
    padding:0 10px;
  }

  #messages{
    padding:12px;
  }

  .msg{
    max-width:88%;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <h1>رهام</h1>
    <span>هوش مصنوعی</span>
  </div>
</header>

<main>

<div id="chatTab">

  <div id="messages">
    <div class="msg sys">
      با رهام چت کن. می‌توانی عکس هم برای رهام بفرستی.
    </div>
  </div>

  <div class="image-preview" id="imagePreview">
    <img id="previewImg" alt="پیش‌نمایش عکس">
    <button id="removeImage">حذف عکس</button>
  </div>

  <div class="chat-input-row">

    <label class="upload-label" for="imageInput">
      ارسال عکس
    </label>

    <input
      id="imageInput"
      type="file"
      accept="image/png,image/jpeg,image/webp"
    >

    <textarea
      id="chatInput"
      placeholder="پیامت را بنویس..."
    ></textarea>

    <button class="send" id="sendBtn">
      ارسال
    </button>

  </div>

</div>

</main>

<script>
(function(){

"use strict";

var messagesEl = document.getElementById("messages");
var chatInput = document.getElementById("chatInput");
var sendBtn = document.getElementById("sendBtn");

var imageInput = document.getElementById("imageInput");
var imagePreview = document.getElementById("imagePreview");
var previewImg = document.getElementById("previewImg");
var removeImage = document.getElementById("removeImage");

var selectedImage = null;


/* =========================
   هویت رهام
========================= */

var creatorAnswer = "من رو رهام مولایی ساخته.";


/* =========================
   تاریخچه گفتگو
========================= */

var history = [

  {
    role:"system",
    content:
    "تو «رهام» هستی، یک دستیار هوش مصنوعی فارسی‌زبان. " +
    "همیشه تا جای ممکن فارسی و دوستانه پاسخ بده. " +
    "نام تو رهام است. " +
    "اگر درباره سازنده یا خالق تو سؤال شد، بگو: «من رو رهام مولایی ساخته.» " +
    "هرگز در پاسخ به سؤال درباره سازنده خودت، نام OpenAI، ChatGPT یا شرکت دیگری را به عنوان سازنده خودت معرفی نکن. " +
    "تو قابلیت ساخت یا تولید تصویر نداری. " +
    "اگر کاربر از تو خواست تصویر بسازی، بگو قابلیت ساخت تصویر نداری. " +
    "اگر کاربر یک تصویر ارسال کرد، در صورت پشتیبانی سرویس، تصویر را تحلیل کن و درباره آن پاسخ بده."
  }

];


/* =========================
   نمایش پیام
========================= */

function addBubble(text, type){

  var div = document.createElement("div");

  div.className = "msg " + type;

  div.textContent = text;

  messagesEl.appendChild(div);

  messagesEl.scrollTop = messagesEl.scrollHeight;

  return div;
}


/* =========================
   تشخیص سؤال سازنده
========================= */

function normalize(text){

  return text
    .replace(/ي/g,"ی")
    .replace(/ك/g,"ک")
    .replace(/ۀ/g,"ه")
    .replace(/‌/g," ")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();

}


function isCreatorQuestion(text){

  var t = normalize(text);

  var patterns = [

    "کی تورو ساخته",
    "کی تو رو ساخته",
    "کی تو را ساخته",
    "کی تورو ساخت",
    "کی تو رو ساخت",
    "کی تو را ساخت",

    "چه کسی تورو ساخته",
    "چه کسی تو رو ساخته",
    "چه کسی تو را ساخته",

    "چه کسی تورو ساخت",
    "چه کسی تو رو ساخت",
    "چه کسی تو را ساخت",

    "سازندت کیه",
    "سازنده ت کیه",
    "سازنده ات کیه",
    "سازنده تو کیه",

    "خالق تو کیه",
    "خالق ت کیه",

    "تو رو کی ساخته",
    "تورو کی ساخته",
    "تو را کی ساخته",

    "چه کسی ساختت",
    "کی ساختت",

    "چه کسی تو را ساخته است",
    "چه کسی تو رو ساخته است",
    "چه کسی تورو ساخته است"

  ];

  for(var i=0;i<patterns.length;i++){

    if(t.indexOf(patterns[i]) !== -1){
      return true;
    }

  }

  return false;
}


/* =========================
   تشخیص سؤال هویت
========================= */

function isIdentityQuestion(text){

  var t = normalize(text);

  var patterns = [

    "تو چی هستی",
    "تو چیه",
    "تو کی هستی",
    "کی هستی",
    "خودتو معرفی کن",
    "خودت رو معرفی کن",
    "اسمت چیه",
    "نامت چیه",
    "اسم تو چیه",

    "چت جی پی تی هستی",
    "chatgpt هستی",
    "chat gpt هستی",

    "اوپن ای آی هستی",
    "openai هستی",

    "تو chatgpt ای",
    "تو openai ای"

  ];

  for(var i=0;i<patterns.length;i++){

    if(t.indexOf(patterns[i]) !== -1){
      return true;
    }

  }

  return false;
}


/* =========================
   پاسخ هویت
========================= */

function identityAnswer(text){

  var t = normalize(text);

  if(
    t.indexOf("چت جی پی تی") !== -1 ||
    t.indexOf("chatgpt") !== -1 ||
    t.indexOf("chat gpt") !== -1 ||
    t.indexOf("openai") !== -1 ||
    t.indexOf("اوپن ای آی") !== -1
  ){

    return "من رهام هستم، یک دستیار هوش مصنوعی. من رو رهام مولایی ساخته.";

  }

  return "من رهام هستم، یک دستیار هوش مصنوعی فارسی‌زبان.";
}


/* =========================
   انتخاب عکس
========================= */

imageInput.addEventListener("change",function(){

  var file = imageInput.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){

    addBubble(
      "لطفاً یک فایل تصویری انتخاب کن.",
      "sys"
    );

    imageInput.value = "";

    return;
  }


  var reader = new FileReader();

  reader.onload = function(e){

    selectedImage = e.target.result;

    previewImg.src = selectedImage;

    imagePreview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* =========================
   حذف عکس
========================= */

removeImage.addEventListener("click",function(){

  selectedImage = null;

  imageInput.value = "";

  previewImg.src = "";

  imagePreview.style.display = "none";

});


/* =========================
   ارسال پیام
========================= */

function sendMessage(){

  var text = chatInput.value.trim();


  if(!text && !selectedImage){
    return;
  }


  /* سؤال سازنده */

  if(text && isCreatorQuestion(text) && !selectedImage){

    addBubble(text,"user");

    chatInput.value = "";

    setTimeout(function(){

      addBubble(
        creatorAnswer,
        "ai"
      );

    },150);

    return;
  }


  /* سؤال هویت */

  if(text && isIdentityQuestion(text) && !selectedImage){

    addBubble(text,"user");

    chatInput.value = "";

    setTimeout(function(){

      addBubble(
        identityAnswer(text),
        "ai"
      );

    },150);

    return;
  }


  /* نمایش پیام */

  if(text){

    addBubble(text,"user");

  }else{

    addBubble(
      "این عکس را بررسی کن.",
      "user"
    );

  }


  sendBtn.disabled = true;


  var thinking = addBubble(
    selectedImage
      ? "رهام در حال بررسی عکس است..."
      : "رهام در حال نوشتن پاسخ است...",
    "sys"
  );


  var userMessage;


  /* پیام دارای عکس */

  if(selectedImage){

    userMessage = {

      role:"user",

      content:[

        {
          type:"text",
          text:
            text ||
            "این تصویر را بررسی کن و توضیح بده چه چیزی در آن می‌بینی."
        },

        {
          type:"image_url",
          image_url:{
            url:selectedImage
          }
        }

      ]

    };


  }else{

    userMessage = {

      role:"user",

      content:text

    };

  }


  history.push(userMessage);


  /* =========================
     درخواست به سرویس
  ========================= */

  fetch(
    "https://text.pollinations.ai/openai/chat/completions",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        model:"openai",

        messages:history,

        temperature:0.7

      })

    }
  )

  .then(function(response){

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    return response.json();

  })


  .then(function(data){

    thinking.remove();


    var reply =
      data &&
      data.choices &&
      data.choices[0] &&
      data.choices[0].message &&
      data.choices[0].message.content;


    if(!reply){

      throw new Error(
        "پاسخ خالی بود"
      );

    }


    /* اگر مدل آرایه برگرداند */

    if(Array.isArray(reply)){

      reply = reply.map(function(item){

        if(typeof item === "string"){
          return item;
        }

        if(item && item.text){
          return item.text;
        }

        return "";

      }).join("");

    }


    /*
      محافظ هویت:
      اگر مدل اشتباهاً درباره سازنده
      چیز دیگری گفت، پاسخ را اصلاح می‌کنیم.
    */

    if(
      text &&
      isCreatorQuestion(text)
    ){

      reply = creatorAnswer;

    }


    addBubble(
      reply,
      "ai"
    );


    history.push({

      role:"assistant",

      content:reply

    });

  })


  .catch(function(error){

    thinking.remove();


    addBubble(

      "اتصال به سرویس هوش مصنوعی برقرار نشد (" +
      error.message +
      "). کمی بعد دوباره امتحان کن.",

      "sys"

    );


    /*
      پیام ناموفق از تاریخچه حذف شود
    */

    history.pop();

  })


  .finally(function(){

    sendBtn.disabled = false;

  });


  /* پاک کردن عکس */

  selectedImage = null;

  imageInput.value = "";

  previewImg.src = "";

  imagePreview.style.display = "none";

}


/* =========================
   دکمه ارسال
========================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================
   Enter
========================= */

chatInput.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }

  }
);

})();
</script>

</body>
</html>
```
