<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roham AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
flex-direction:column
}

header{
height:65px;
display:flex;
align-items:center;
justify-content:center;
border-bottom:1px solid #222;
font-size:22px;
font-weight:bold
}

#chat{
flex:1;
overflow-y:auto;
padding:20px
}

.message{
max-width:850px;
margin:0 auto 22px;
line-height:2;
white-space:pre-wrap;
word-wrap:break-word
}

.user{
color:#888
}

.ai{
color:#fff
}

.loading{
color:#777
}

.bottom{
padding:14px;
border-top:1px solid #222;
display:flex;
gap:10px;
background:#000
}

textarea{
flex:1;
background:#111;
color:#fff;
border:1px solid #333;
border-radius:12px;
padding:14px;
font-size:16px;
outline:none;
resize:none
}

textarea:focus{
border-color:#666
}

button{
width:90px;
border:0;
border-radius:12px;
background:#fff;
color:#000;
font-size:16px;
cursor:pointer
}

button:disabled{
opacity:.5
}
</style>
</head>

<body>

<header>Roham AI</header>

<div id="chat"></div>

<div class="bottom">
<textarea
id="input"
rows="2"
placeholder="سؤالت را بنویس..."
></textarea>

<button id="send">ارسال</button>
</div>

<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text,type){

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
}


function isCreatorQuestion(text){

    const q = text
        .replace(/[؟?!.,،]/g,"")
        .replace(/\s+/g," ")
        .trim()
        .toLowerCase();

    return (
        q.includes("کی تورو ساخته") ||
        q.includes("چه کسی تو را ساخته") ||
        q.includes("چه کسی تورو ساخته") ||
        q.includes("چه کسی تو رو ساخته") ||
        q.includes("سازنده تو کیه") ||
        q.includes("سازندت کیه") ||
        q.includes("تو رو کی ساخته") ||
        q.includes("تورو کی ساخته") ||
        q.includes("سازنده کیه")
    );
}


async function askAI(){

    const question = input.value.trim();

    if(!question) return;

    addMessage(question,"user");

    input.value = "";

    send.disabled = true;

    if(isCreatorQuestion(question)){

        addMessage("رهام مولایی فر ساخته","ai");

        send.disabled = false;

        input.focus();

        return;
    }

    const answerBox = addMessage(
        "در حال پاسخ...",
        "ai loading"
    );

    try{

        const systemPrompt =
        "تو Roham AI هستی. " +
        "به سؤال کاربر مستقیم و واضح جواب بده. " +
        "پاسخ را به زبان سؤال کاربر بده. " +
        "هیچ عبارت اضافی مثل Answer، Roham یا پاسخ اضافه نکن. " +
        "اگر سؤال درباره سازنده تو بود، بگو: رهام مولایی فر ساخته.";

        const fullPrompt =
        systemPrompt +
        "\n\nسؤال کاربر:\n" +
        question;

        const url =
        "https://text.pollinations.ai/" +
        encodeURIComponent(fullPrompt) +
        "?model=openai";

        const response = await fetch(url);

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const answer = await response.text();

        if(!answer || !answer.trim()){

            throw new Error("EMPTY_RESPONSE");

        }

        answerBox.className = "message ai";

        answerBox.textContent = answer.trim();

    }catch(error){

        console.error(error);

        answerBox.className = "message ai";

        answerBox.textContent =
        "فعلاً نتونستم به سرویس هوش مصنوعی وصل بشم. دوباره امتحان کن.";

    }

    send.disabled = false;

    input.focus();
}


send.addEventListener("click",askAI);


input.addEventListener("keydown",function(event){

    if(event.key === "Enter" && !event.shiftKey){

        event.preventDefault();

        askAI();

    }

});

</script>

</body>
</html>
