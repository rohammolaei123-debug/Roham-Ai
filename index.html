<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roham AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
flex-direction:column
}

header{
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
border-bottom:1px solid #222
}

#chat{
flex:1;
overflow-y:auto;
padding:20px
}

.msg{
max-width:800px;
margin:0 auto 20px;
line-height:2;
white-space:pre-wrap
}

.user{color:#888}
.ai{color:#fff}

.bottom{
display:flex;
gap:10px;
padding:15px;
border-top:1px solid #222
}

textarea{
flex:1;
background:#111;
color:white;
border:1px solid #333;
border-radius:12px;
padding:14px;
font-size:16px;
resize:none;
outline:none
}

button{
background:white;
color:black;
border:0;
border-radius:12px;
padding:0 22px;
font-size:16px
}
</style>
</head>

<body>

<header>Roham AI</header>

<div id="chat"></div>

<div class="bottom">
<textarea id="input" rows="2" placeholder="سؤالت را بنویس..."></textarea>
<button onclick="send()">ارسال</button>
</div>

<script>

const input=document.getElementById("input");
const chat=document.getElementById("chat");

function add(text,type){
let d=document.createElement("div");
d.className="msg "+type;
d.textContent=text;
chat.appendChild(d);
chat.scrollTop=chat.scrollHeight;
}

function answer(q){

q=q.trim();

let x=q.replace(/[؟?!.,،]/g,"").toLowerCase();

if(
x.includes("کی تورو ساخته") ||
x.includes("چه کسی تو را ساخته") ||
x.includes("چه کسی تورو ساخته") ||
x.includes("سازنده تو کیه") ||
x.includes("سازندت کیه") ||
x.includes("تو رو کی ساخته") ||
x.includes("تورو کی ساخته")
){
return "رهام مولایی فر ساخته";
}

if(x.includes("سلام"))
return "سلام! چطور می‌تونم کمکت کنم؟";

if(x.includes("اسمت چیه") || x.includes("نامت چیه"))
return "من Roham AI هستم.";

if(x.includes("رهام کیه"))
return "رهام مولایی فر سازنده من است.";

if(x.includes("امروز چند شنبه"))
return "برای گفتن روز دقیق، تاریخ دستگاه شما را بررسی کنید.";

if(x.includes("ممنون") || x.includes("مرسی"))
return "خواهش می‌کنم.";

if(x.includes("خداحافظ"))
return "خداحافظ!";

return "سؤال شما دریافت شد.\n\nبرای اینکه Roham AI بتواند درباره موضوعات مختلف پاسخ واقعی و آزاد تولید کند، باید به یک سرویس هوش مصنوعی متصل شود. این نسخه بدون API ساخته شده و فقط پاسخ‌های داخلی دارد.";
}

function send(){

let q=input.value.trim();

if(!q)return;

add(q,"user");

input.value="";

setTimeout(()=>{
add(answer(q),"ai");
},300);
}

input.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){
e.preventDefault();
send();
}

});

</script>

</body>
</html>
