```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roham AI</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Tahoma, Arial, sans-serif;
}

body {
    overflow: hidden;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #000;
}

/* Header */

.header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #1b1b1b;
    flex-shrink: 0;
}

.logo {
    color: #fff;
    font-size: 21px;
    font-weight: bold;
}

/* Messages */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px 15px 30px;
}

.message {
    width: 100%;
    max-width: 850px;
    margin: 0 auto 22px;
}

.user {
    display: flex;
    justify-content: flex-start;
}

.userBubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    background: #181818;
    color: #fff;
    line-height: 1.8;
    white-space: pre-wrap;
}

.ai {
    display: block;
}

.aiText {
    color: #fff;
    font-size: 16px;
    line-height: 2;
    white-space: pre-wrap;
}

/* Loading */

.loading {
    color: #fff;
    opacity: .65;
}

/* Input */

.inputArea {
    width: 100%;
    padding: 14px;
    border-top: 1px solid #1b1b1b;
    background: #000;
    flex-shrink: 0;
}

.inputBox {
    max-width: 850px;
    margin: auto;
    display: flex;
    gap: 9px;
}

.input {
    flex: 1;
    min-height: 50px;
    max-height: 150px;
    resize: none;

    background: #111;
    color: #fff;

    border: 1px solid #292929;
    border-radius: 15px;

    padding: 13px 15px;

    outline: none;
    font-size: 15px;
}

.input::placeholder {
    color: #777;
}

.input:focus {
    border-color: #555;
}

.send {
    width: 54px;
    min-width: 54px;
    height: 50px;

    border: 0;
    border-radius: 15px;

    background: #fff;
    color: #000;

    font-size: 19px;
    cursor: pointer;
}

.send:hover {
    background: #ddd;
}

.send:disabled {
    opacity: .5;
    cursor: default;
}

/* Mobile */

@media (max-width: 600px) {

    .header {
        height: 58px;
    }

    .messages {
        padding: 18px 10px 25px;
    }

    .userBubble {
        max-width: 88%;
    }

    .aiText {
        font-size: 15px;
    }

    .inputArea {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">Roham AI</div>
    </header>

    <main
        id="messages"
        class="messages"
    ></main>

    <div class="inputArea">

        <div class="inputBox">

            <textarea
                id="input"
                class="input"
                placeholder="پیامت را بنویس..."
                rows="1"
            ></textarea>

            <button
                id="send"
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>

<script>

/*
==================================================
تنظیمات
==================================================
*/

const API_URL = "";

/*
اگر بک‌اند خودت را ساختی، آدرس آن را اینجا قرار بده.

مثال:

const API_URL =
"https://your-server.example/api/chat";

*/


const messages =
    document.getElementById("messages");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("send");


/*
==================================================
پیام کاربر
==================================================
*/

function addUserMessage(text) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message user";

    const bubble =
        document.createElement("div");

    bubble.className =
        "userBubble";

    bubble.textContent =
        text;

    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    scrollBottom();
}


/*
==================================================
پیام رهام
==================================================
*/

function addAIMessage(text) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message ai";

    const answer =
        document.createElement("div");

    answer.className =
        "aiText";

    /*
    فقط خود جواب نمایش داده می‌شود.
    هیچ عبارت اضافه‌ای مثل:
    "رهام:"
    "پاسخ:"
    یا متن اضافی اضافه نمی‌شود.
    */

    answer.textContent =
        text;

    wrapper.appendChild(answer);

    messages.appendChild(wrapper);

    scrollBottom();
}


/*
==================================================
پیام در حال پاسخ
==================================================
*/

function addLoading() {

    const wrapper =
        document.createElement("div");

    wrapper.id =
        "loading";

    wrapper.className =
        "message ai";

    const text =
        document.createElement("div");

    text.className =
        "aiText loading";

    text.textContent =
        "در حال پاسخ...";

    wrapper.appendChild(text);

    messages.appendChild(wrapper);

    scrollBottom();
}


function removeLoading() {

    const loading =
        document.getElementById("loading");

    if (loading) {

        loading.remove();

    }
}


/*
==================================================
ارسال سؤال
==================================================
*/

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) return;

    addUserMessage(text);

    input.value = "";

    input.style.height = "auto";

    sendButton.disabled = true;

    addLoading();


    /*
    پاسخ مخصوص سازنده
    */

    const normalized =
        text
        .toLowerCase()
        .replaceAll("ي", "ی")
        .replaceAll("ك", "ک");


    if (
        normalized.includes("کی تورو ساخته") ||
        normalized.includes("چه کسی تورو ساخته") ||
        normalized.includes("چه کسی تو را ساخته") ||
        normalized.includes("سازنده تو کیه") ||
        normalized.includes("سازنده شما کیست") ||
        normalized.includes("سازنده ات کیه") ||
        normalized.includes("سازنده‌ات کیه")
    ) {

        removeLoading();

        addAIMessage(
            "رهام مولایی فر"
        );

        sendButton.disabled = false;

        return;
    }


    /*
    اگر API تنظیم نشده باشد
    */

    if (!API_URL) {

        removeLoading();

        addAIMessage(
            "برای پاسخ‌گویی واقعی، اتصال هوش مصنوعی باید در بخش API تنظیم شود."
        );

        sendButton.disabled = false;

        return;
    }


    /*
    اتصال به بک‌اند واقعی
    */

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message: text

                })

            });


        if (!response.ok) {

            throw new Error(
                "API Error"
            );

        }


        const data =
            await response.json();


        removeLoading();


        /*
        فقط answer نمایش داده می‌شود.
        */

        addAIMessage(
            data.answer || "پاسخی دریافت نشد."
        );


    } catch (error) {

        removeLoading();

        addAIMessage(
            "ارتباط با هوش مصنوعی برقرار نشد."
        );

    }


    sendButton.disabled = false;

}


/*
==================================================
Enter
==================================================
*/

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/*
==================================================
افزایش خودکار ارتفاع کادر
==================================================
*/

input.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                150
            ) + "px";

    }
);


/*
==================================================
اسکرول
==================================================
*/

function scrollBottom() {

    messages.scrollTop =
        messages.scrollHeight;

}

</script>

</body>
</html>
```
